name: Desktop bundles

on:
  # Full desktop bundles are the expensive release proof. Ordinary source and
  # documentation PRs use CI; packaging-sensitive changes still build both.
  pull_request:
    paths:
      - ".github/workflows/bundles.yml"
      - "build_release.bat"
      - "build_release_macos.sh"
      - "build_installer.bat"
      - "installer/**"
      - "packaging/**"
      - "requirements-release.lock"
      - "source/requirements.txt"
      - "source/requirements-voice.txt"
      - "source/requirements-build.txt"
      - "source/native/**"
      - "source/clean_ffmpeg_runtime.py"
      - "source/voice_runtime_probe.py"
      - "source/summary_runtime_probe.py"
      - "source/sqlite_runtime_probe.py"
      - "source/tests/test_voice_packaging.py"
      - "source/snipvoice.ico"
      - "source/snipvoice.icns"
      - "source/snipvoice-icon.png"
      - "THIRD_PARTY_NOTICES.md"
      - "LICENSE"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bundles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SNIPVOICE_VERSION: "3.1.0"

jobs:
  windows:
    name: Windows x64 bundle and installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            source/requirements-voice.txt
            source/requirements-build.txt
            packaging/requirements-build.txt

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - name: Verify release metadata
        shell: pwsh
        run: |
          $source = Get-Content -Raw source/snipvoice.pyw
          $installer = Get-Content -Raw installer/snipvoice.iss
          if ($source -notmatch "APP_VERSION = `"$env:SNIPVOICE_VERSION`"") { throw "source version mismatch" }
          if ($source -notmatch "RELEASE_CHANNEL = `"stable`"") { throw "source channel is not stable" }
          if ($installer -notmatch "MyAppVersion `"$env:SNIPVOICE_VERSION`"") { throw "installer version mismatch" }
          if ($installer -notmatch "MyAppChannel `"stable`"") { throw "installer channel is not stable" }

      - name: Build clean LGPL audio runtime
        shell: msys2 {0}
        run: |
          python -m pip install --require-hashes -r packaging/requirements-build.lock
          python packaging/clean_audio_runtime.py \
            --work-dir build/clean-audio \
            --wheel-dir build/clean-audio-wheel \
            --compliance-dir build/clean-audio-compliance

      - name: Install bundle dependencies and clean PyAV wheel
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          $wheel = (Get-ChildItem -LiteralPath build/clean-audio-wheel -Filter 'av-*.whl' -File -ErrorAction Stop).FullName
          if ($wheel.Count -ne 1) { throw "Expected exactly one clean PyAV wheel" }
          python -m pip install --no-index $wheel
          $env:PYTHONPATH = "source"
          $python = (Get-Command python -ErrorAction Stop).Source
          $pythonDirectory = Split-Path -Parent $python
          $env:PATH = "$pythonDirectory;$env:SystemRoot\System32;$env:SystemRoot"
          & $python -c "from clean_ffmpeg_runtime import verify_clean_ffmpeg_runtime; verify_clean_ffmpeg_runtime()"

      - name: Build application and installer
        shell: cmd
        env:
          SNIPVOICE_BUILD_NONINTERACTIVE: "1"
          SNIPVOICE_FFMPEG_COMPLIANCE_DIR: ${{ github.workspace }}\build\clean-audio-compliance
        run: |
          call build_release.bat
          call build_installer.bat

      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "Snipvoice-$env:SNIPVOICE_VERSION-windows-x64.zip"
          $installer = "installer/Output/SnipvoiceSetup-$env:SNIPVOICE_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "installer not found: $installer" }
          Compress-Archive -Path dist/Snipvoice -DestinationPath $archive
          foreach ($path in @($archive, $installer)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))" | Set-Content -NoNewline -Encoding ascii "$path.sha256"
          }
          Copy-Item -LiteralPath build/clean-audio-compliance/ffmpeg-8.1.2.tar.xz -Destination "Snipvoice-$env:SNIPVOICE_VERSION-ffmpeg-source.tar.xz"
          Compress-Archive -Path build/clean-audio-compliance/* -DestinationPath "Snipvoice-$env:SNIPVOICE_VERSION-windows-ffmpeg-build-info.zip"
          foreach ($path in @("Snipvoice-$env:SNIPVOICE_VERSION-ffmpeg-source.tar.xz", "Snipvoice-$env:SNIPVOICE_VERSION-windows-ffmpeg-build-info.zip")) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))" | Set-Content -NoNewline -Encoding ascii "$path.sha256"
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: snipvoice-${{ env.SNIPVOICE_VERSION }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-windows-x64.zip
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-windows-x64.zip.sha256
            installer/Output/SnipvoiceSetup-${{ env.SNIPVOICE_VERSION }}.exe
            installer/Output/SnipvoiceSetup-${{ env.SNIPVOICE_VERSION }}.exe.sha256
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-ffmpeg-source.tar.xz
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-ffmpeg-source.tar.xz.sha256
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-windows-ffmpeg-build-info.zip
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-windows-ffmpeg-build-info.zip.sha256

  macos:
    name: macOS ARM64 bundle
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            source/requirements-voice.txt
            source/requirements-build.txt
            packaging/requirements-build.txt

      - name: Verify release metadata and architecture
        run: |
          test "$(uname -m)" = "arm64"
          grep -Fq "APP_VERSION = \"$SNIPVOICE_VERSION\"" source/snipvoice.pyw
          grep -Fq 'RELEASE_CHANNEL = "stable"' source/snipvoice.pyw

      - name: Build clean LGPL audio runtime
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.4"
        run: |
          python -m pip install --require-hashes -r packaging/requirements-build.lock
          python packaging/clean_audio_runtime.py \
            --work-dir build/clean-audio \
            --wheel-dir build/clean-audio-wheel \
            --compliance-dir build/clean-audio-compliance

      - name: Install bundle dependencies and clean PyAV wheel
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          wheel=(build/clean-audio-wheel/av-*.whl)
          test "${#wheel[@]}" -eq 1
          python -m pip install --no-index "${wheel[0]}"
          DYLD_LIBRARY_PATH= PYTHONPATH=source python -c "from clean_ffmpeg_runtime import verify_clean_ffmpeg_runtime; verify_clean_ffmpeg_runtime()"

      - name: Build application bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.4"
          SNIPVOICE_FFMPEG_COMPLIANCE_DIR: ${{ github.workspace }}/build/clean-audio-compliance
        run: ./build_release_macos.sh

      - name: Verify, package and checksum
        run: |
          test "$(plutil -extract CFBundleShortVersionString raw dist/Snipvoice.app/Contents/Info.plist)" = "$SNIPVOICE_VERSION"
          test "$(plutil -extract SnipvoiceReleaseChannel raw dist/Snipvoice.app/Contents/Info.plist)" = "stable"
          codesign --verify --deep --strict dist/Snipvoice.app
          archive="Snipvoice-$SNIPVOICE_VERSION-macos-arm64.zip"
          ditto -c -k --keepParent dist/Snipvoice.app "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          ditto -c -k build/clean-audio-compliance "Snipvoice-$SNIPVOICE_VERSION-macos-ffmpeg-build-info.zip"
          shasum -a 256 "Snipvoice-$SNIPVOICE_VERSION-macos-ffmpeg-build-info.zip" > "Snipvoice-$SNIPVOICE_VERSION-macos-ffmpeg-build-info.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: snipvoice-${{ env.SNIPVOICE_VERSION }}-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-macos-arm64.zip
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-macos-arm64.zip.sha256
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-macos-ffmpeg-build-info.zip
            Snipvoice-${{ env.SNIPVOICE_VERSION }}-macos-ffmpeg-build-info.zip.sha256
