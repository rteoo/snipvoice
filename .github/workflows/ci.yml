name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes older validation for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    # One lane per supported OS is enough: release Python runs on Windows and
    # macOS, while Linux carries forward-compatibility and focused lint.
    timeout-minutes: 12
    runs-on: ${{ matrix.os }}
    strategy:
      # A lint or platform failure invalidates the run; cancel siblings and
      # spend the saved runner time on the corrected commit.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            source/requirements-voice.txt
            source/requirements-dev.txt

      - name: Install focused lint tools
        if: runner.os == 'Linux'
        run: python -m pip install -r source/requirements-dev.txt

      - name: Run focused lint
        if: runner.os == 'Linux'
        run: python -m ruff check source

      # Linux needs Xvfb/Tk for the real GUI tests and PortAudio for the pinned
      # sounddevice import. One apt transaction replaces the former split jobs.
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb tk libportaudio2

      - name: Install application and native voice dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt -r requirements-voice.txt

      - name: Build Windows capture helper
        if: runner.os == 'Windows'
        shell: cmd
        run: call source\native\build_windows_capture.bat

      - name: Build macOS capture helper
        if: runner.os == 'macOS'
        run: sh source/native/build_macos_capture.sh

      # This guard keeps the former native-voice lane's strict contract: every
      # platform must import the pinned runtimes and exercise runtime/resampler
      # tests without optional skips before the complete suite runs.
      - name: Require native voice imports
        working-directory: source
        run: python -c "import sounddevice, soxr, transcribe_cpp, transcribe_cpp_native"

      - name: Run native voice tests without skips
        working-directory: source
        run: >-
          python -c "import unittest; loader=unittest.defaultTestLoader;
          suite=unittest.TestSuite((loader.loadTestsFromName('tests.test_voice_runtime'),
          loader.loadTestsFromName('tests.test_voice_resampler')));
          result=unittest.TextTestRunner(verbosity=2).run(suite);
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped and result.testsRun else 1)"

      - name: Run test suite
        if: runner.os != 'Linux'
        working-directory: source
        run: python -m unittest discover -s tests -q

      - name: Run test suite (headless X server)
        if: runner.os == 'Linux'
        working-directory: source
        run: xvfb-run -a python -m unittest discover -s tests -q
