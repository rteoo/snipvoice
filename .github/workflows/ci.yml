name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes older validation for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    # A headless Tk regression must fail boundedly instead of consuming the
    # runner's six-hour cap while orphaning xvfb/python processes.
    timeout-minutes: 10
    # Windows-first app, but the POSIX backends (clipboard, autostart,
    # single-instance lockfile) are only honestly covered if they run on a real
    # macOS/Linux host. The GUI tests self-skip where Tk has no display.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: source/requirements.txt

      # pynput and pystray both bind to Xorg on Linux and raise at import time
      # with no DISPLAY, and setup-python's CPython links _tkinter against the
      # system libtk8.6. Xvfb plus those libs is what makes the suite runnable.
      - name: Install Linux headless GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb tk

      - name: Install dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        if: runner.os != 'Linux'
        working-directory: source
        run: python -m unittest discover -s tests -v

      - name: Run test suite (headless X server)
        if: runner.os == 'Linux'
        working-directory: source
        run: xvfb-run -a python -m unittest discover -s tests -v

  lint:
    name: focused lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: source/requirements-dev.txt

      - name: Install development lint tools
        run: python -m pip install -r source/requirements-dev.txt

      # Keep this lane focused on undefined names, unused imports, and duplicate
      # definitions; runtime dependencies remain in the test jobs above.
      - name: Run focused lint
        run: python -m ruff check source

  voice-native:
    name: native voice (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            source/requirements-voice.txt

      # This lane deliberately installs the pinned native voice runtime. Its
      # wheels cover the supported runner architectures; no microphone or model
      # download is needed by the import and unit-test probes below.
      - name: Install Linux PortAudio runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Install core and native voice dependencies
        working-directory: source
        run: python -m pip install -r requirements.txt -r requirements-voice.txt

      - name: Require native voice imports
        working-directory: source
        run: python -c "import sounddevice, soxr, transcribe_cpp, transcribe_cpp_native"

      # The core-only suite intentionally permits optional-runtime skips. This
      # native lane fails if either voice module skips, so a green job proves the
      # pinned runtime was actually exercised.
      - name: Run native voice tests without skips
        working-directory: source
        run: >-
          python -c "import unittest; loader=unittest.defaultTestLoader;
          suite=unittest.TestSuite((loader.loadTestsFromName('tests.test_voice_runtime'),
          loader.loadTestsFromName('tests.test_voice_resampler')));
          result=unittest.TextTestRunner(verbosity=2).run(suite);
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped and result.testsRun else 1)"
