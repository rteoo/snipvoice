<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SnipVoice</title>
  <desc id="desc">Small-size SnipVoice mark: a bold microphone and a copper recording dot on a matte navy tile.</desc>

  <!-- Drawn for 16-24 px slots: the waveform bars would fall below one pixel,
       so the glyph keeps only the microphone and the dot, with heavier strokes.
       Same canvas and tile placement as snipvoice-icon.svg. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#263C56"/>
  <rect x="80" y="80" width="864" height="864" rx="184" fill="none" stroke="#8CA8CF" stroke-opacity="0.55" stroke-width="32"/>
  <rect x="404" y="208" width="216" height="408" rx="108" fill="#F2EFE9"/>
  <path d="M312 500 Q312 716 512 716 Q712 716 712 500 M512 716 V820" fill="none" stroke="#F2EFE9" stroke-width="84" stroke-linecap="round"/>
  <circle cx="768" cy="256" r="100" fill="#E6A05A" stroke="#263C56" stroke-width="36"/>
</svg>
