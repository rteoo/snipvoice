<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SnipVoice</title>
  <desc id="desc">A microphone between sound-wave bars with a copper recording dot on a rounded matte navy tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263C56"/>
      <stop offset="1" stop-color="#152235"/>
    </linearGradient>
  </defs>

  <!-- Tile: matte navy-500 to the slate-navy rail, with a navy-400 rim that
       keeps its edge on dark taskbars. No sheen or glow: the system is matte. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="192" fill="none" stroke="#8CA8CF" stroke-opacity="0.45" stroke-width="16"/>

  <!-- Sound: waveform bars either side of the microphone, in navy-300. -->
  <path d="M196 468 V556 M268 410 V614 M756 410 V614 M828 468 V556" fill="none" stroke="#ADC1DC" stroke-width="44" stroke-linecap="round"/>
  <!-- Microphone: capsule, cradle, stem and base, flat text ink. -->
  <rect x="424" y="232" width="176" height="356" rx="88" fill="#F2EFE9"/>
  <path d="M352 492 Q352 676 512 676 Q672 676 672 492 M512 676 V772 M416 784 H608" fill="none" stroke="#F2EFE9" stroke-width="56" stroke-linecap="round"/>
  <!-- Recording: the one copper accent, separated from the tile by a navy ring. -->
  <circle cx="776" cy="252" r="72" fill="#E6A05A" stroke="#152235" stroke-width="24"/>
</svg>
